            /* 聚焦範圍：只有框內維持正常著色，框外淡成線稿。
               box:[x0,x1,z0,z1] 是「緊貼該設備的矩形」（世界座標，公尺）——
               取代原本的 fr 半徑正方形。半徑框一定是正方形又以注視點為中心，
               設備是長條形時就會多框到隔壁（例如儲能陣列的框會咬到變電站）。
               矩形可以 X/Z 各自給界線，貼著設備切，不會開到別的地方。
               fr 保留當後備：沒給 box 的站仍走舊行為。

               az/po＝該站的視角關鍵幀（度）。原本整段巡覽只有 t 與 zoom
               在動、方向恆為 CAM_DIR，捲起來像在平移一張等距圖，沒有運鏡。
               現在方向跟著 t／zoom 一起插值，鏡頭會邊飛邊轉。
                 ・az＝方位角，繞著場站轉；這裡排成單向緩慢掃過去，
                   來回擺盪會暈
                 ・po＝與 +Y 的夾角，越大＝鏡頭越低越接近平視。
                   平的主體（太陽能陣列）給小 po 俯視看排列，
                   高的主體（風機、鐵塔）給大 po 壓低讓它頂到天空
               不給 az/po 的站（全景）沿用外層 ?az/?po 的構圖，
               所以全景進出的畫面與改動前完全一致。
               OrbitControls 的 polar 夾角在有 ?az/?po 時放寬到 .12~1.5 rad
               （6.9°~85.9°），po 必須留在這個範圍內否則會被 update() 夾掉。 */
            { name: '太陽能場', label: '太陽能場', t: V(-26, 0, -27), zoom: 2.1, anchor: V(-26, 4.8, -27), box: [-38, -13, -38, -16], az: 12, po: 56 },
            { name: '儲能陣列', label: '儲能陣列', t: V(-5, 0, -7), zoom: 2, anchor: V(-5, 4.8, -7), box: [-23, 10, -22, 8], az: 30, po: 63 },
            { name: '變電與管理', label: '變電站', t: V(24, 0, -4), zoom: 2, anchor: V(24, 10.2, -8), box: [13, 35, -17, 8], az: 58, po: 64 },
            { name: '控制中心', label: '控制中心', t: V(9, 0, 16), zoom: 2.3, anchor: V(6, 5.8, 20), box: [-1, 19, 8, 25], az: 76, po: 69 },
            { name: '風力發電', label: '風力發電', t: V(12, 9, -54), zoom: 1.5, anchor: V(12, 16, -54), box: [-16, 40, -70, -40], az: 44, po: 73 },
            { name: '輸電鐵塔', label: '輸電鐵塔', t: V(52, 8, 9), zoom: 1.45, anchor: V(52, 20, -6), box: [38, 66, -22, 26], az: 32, po: 64 },
        ];
        let zoneIdx = 0;

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = .07;
        controls.enablePan = false;
        controls.minZoom = .62;
        controls.maxZoom = 4.5;
        controls.minPolarAngle = .5;
        controls.maxPolarAngle = 1.32;
        controls.autoRotate = true;              // 閒置慢速環繞，第一次拖曳即停
        controls.autoRotateSpeed = -.42;
        canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; }, { once: true });

        function poseFor(z) {
            // 保持目前視角方向飛行：自訂角度或拖曳後，切區域不會被重設回預設等距角
            const d = camera.position.clone().sub(controls.target);
            const dir = d.lengthSq() > 1 ? d.normalize() : DIR;
            return { target: z.t.clone(), pos: z.t.clone().addScaledVector(dir, R), zoom: z.zoom };
        }
        {
            const p = poseFor(ZONES[0]);
            camera.position.copy(p.pos);
            controls.target.copy(p.target);
            camera.zoom = p.zoom;
            camera.updateProjectionMatrix();
        }
        /* URL 視角參數：?az=方位角&po=俯仰角（度）&fov=視野&spin=0 */
        if (Q.has('az') || Q.has('po')) {
            controls.minPolarAngle = .12;    // 放寬夾角，任意 URL 角度都吃得下
            controls.maxPolarAngle = 1.5;
            const az = THREE.MathUtils.degToRad(parseFloat(Q.get('az')) || 45);
            const po = THREE.MathUtils.degToRad(parseFloat(Q.get('po')) || 57);
            camera.position.copy(controls.target)
                .add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(R, po, az)));
            camera.lookAt(controls.target);
        }
        if (Q.has('fov')) { viewH = parseFloat(Q.get('fov')) || viewH; setFrustum(); }
        /* spin：0＝不轉；其他數字＝卷軸特寫模式下的自轉速度（度/秒）。
           scrub 每幀會重算相機位置，OrbitControls 的 autoRotate 會被蓋掉，
           所以自轉改成讓視角方向 CAM_DIR 繞 Y 軸累加角度 */
        const SPIN_DPS = Q.has('spin') ? (parseFloat(Q.get('spin')) || 0) : 0;
        if (Q.get('spin') === '0') controls.autoRotate = false;
        /* ?lock=1 鎖定視角：不能旋轉/縮放/平移，滾輪轉發給外層頁面捲動 */
        const LOCKED = Q.get('lock') === '1';
        if (LOCKED) {
            controls.enableRotate = controls.enableZoom = controls.enablePan = false;
            controls.autoRotate = false;
            addEventListener('wheel', e => {
                if (parent !== window) parent.postMessage({ type: 'ob:wheel', dy: e.deltaY }, '*');
            }, { passive: true });
        }
        /* 視角方向（scrub 捲動特寫沿用）；SPIN_DPS > 0 時繞 Y 軸緩慢自轉 */
        const CAM_DIR = camera.position.clone().sub(controls.target).normalize();
        const SPIN = { a: 0, dir: new THREE.Vector3(), axis: new THREE.Vector3(0, 1, 0) };
        const camDirNow = () => SPIN_DPS
            ? SPIN.dir.copy(CAM_DIR).applyAxisAngle(SPIN.axis, SPIN.a)
            : CAM_DIR;

        /* ══ 巡覽視角插值 ═══════════════════════════════════════
           在 (az, po) 球座標裡插值，不是直接 lerp 方向向量：
           角度有界、看得懂也調得動，而且兩個方向向量做 nlerp 會沿著弦
           而不是弧走，角度一大就會出現「先縮短再拉開」的怪加速。
           BASE_SPH 是外層 ?az/?po（或預設等距）鎖存下來的基準構圖，
           沒給 az/po 的站直接沿用它。 */
        const BASE_SPH = new THREE.Spherical().setFromVector3(CAM_DIR);
        const zoneAz = z => z.az == null ? BASE_SPH.theta : THREE.MathUtils.degToRad(z.az);
        const zonePo = z => z.po == null ? BASE_SPH.phi : THREE.MathUtils.degToRad(z.po);
        /* 方位角一律走最短弧：直接 lerp 的話從 170° 轉到 -170° 會繞 340°
           整整一圈回頭，而不是跨過 180° 的那 20° */
        const arcDelta = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
        const SCRUB_DIR = {
            az: BASE_SPH.theta, po: BASE_SPH.phi,
            v: new THREE.Vector3(), s: new THREE.Spherical(1, 0, 0),
        };
        /* 進 scrub 模式的當下把平滑值對齊現況，否則第一幀會從基準角度
           硬跳到當時的相機角度 */
        const syncScrubDir = () => {
            const d = camera.position.clone().sub(controls.target);
            if (d.lengthSq() < 1) return;
            const sp = new THREE.Spherical().setFromVector3(d.normalize());
            SCRUB_DIR.az = sp.theta; SCRUB_DIR.po = sp.phi;
        };

        // 鏡頭補間（無外部動畫庫）：smootherstep 緩入緩出
        let camTween = null;
        const smootherstep = t => t * t * t * (t * (t * 6 - 15) + 10);
        function flyTo(zone) {
            const p = poseFor(zone);
            camTween = {
                t: 0,
                fromP: camera.position.clone(), toP: p.pos,
                fromT: controls.target.clone(), toT: p.target,
                fromZ: camera.zoom, toZ: p.zoom,
            };
            controls.enabled = false;
        }

        const tagEl = document.getElementById('zoneTag');
        const tagText = document.getElementById('zoneTagText');
        const ZONE_SPOT = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5 };   // 區域 → 對應熱點（滾動巡覽時錨點轉橘）
        function setZone(i) {
            zoneIdx = (i + ZONES.length) % ZONES.length;
            const z = ZONES[zoneIdx];
            flyTo(z);
            tagText.textContent = z.name || '';
            tagEl.classList.toggle('on', !!z.name);
            document.getElementById('zonePrevLabel').textContent = ZONES[(zoneIdx - 1 + ZONES.length) % ZONES.length].label;
            document.getElementById('zoneNextLabel').textContent = ZONES[(zoneIdx + 1) % ZONES.length].label;
            document.querySelectorAll('.spot.is-zone').forEach(o => o.classList.remove('is-zone'));
            const si = ZONE_SPOT[zoneIdx];
            if (si != null && SPOTS[si] && SPOTS[si].el) SPOTS[si].el.classList.add('is-zone');
        }
        document.getElementById('zonePrev').addEventListener('click', () => setZone(zoneIdx - 1));
        document.getElementById('zoneNext').addEventListener('click', () => setZone(zoneIdx + 1));

        /* ══ 藍色六角熱點 ═══════════════════════════════════ */
        /* 只保留巡覽有使用的六個錨點（依巡覽順序） */
        const SPOTS = [
            { p: V(-26, 4.8, -27), title: '太陽能發電陣列', kicker: 'Solar PV Array', body: '固定式支架陣列面朝正南，深藍色模組串接後匯入匯流箱，與儲能系統併網運轉，白天發電、離峰儲存。' },
            { p: V(-5, 4.4, -7), title: '電池貨櫃陣列', kicker: 'Battery Container', body: '20 呎 ISO 規格電池貨櫃 15 座成列，內含電池模組堆疊與熱管理系統，橘色幹管把每櫃串上直流母線。' },
            { p: V(24, 10, -8), title: '變電站', kicker: 'Substation', body: '門型架引接線經礙子串落至兩座主變壓器，中間防火牆隔離，將場站電力升壓送出。' },
            { p: V(6, 5, 20), title: '控制室', kicker: 'Control Room', body: '值班人員在此監控全站：SCADA 畫面、保護電驛與消防系統的第一線。' },
            { p: V(12, 16, -54), title: '風力發電機', kicker: 'Wind Turbine', body: '陸域風機與太陽能互補發電——風光加儲的組合，讓再生能源輸出更平滑可調度。' },
            { p: V(52, 20, -6), title: '輸電鐵塔', kicker: 'Transmission Tower', body: '格構式輸電鐵塔將場站電力送往電網，上下兩層橫擔共四回線路。' },
        ];
        const spotsHost = document.getElementById('spots');
        const card = document.getElementById('card');
        let activeSpot = null;
        SPOTS.forEach((s, i) => {
            const el = document.createElement('div');
            el.className = 'spot';
            /* 錨點標記從 + 換成閃電（使用者要求：改成電流）。
               用 SVG 不用文字符號：⚡ 這類 emoji 在不同系統會被替換成
               彩色字型，顏色就不受 CSS 控制 —— 而巡覽模式正是靠
               .spot 的 color 在 transparent 與 #fff 之間過渡來淡出淡入的。
               fill=currentColor 讓那組規則原封不動繼續生效。
               路徑沿用主站 index00 舊商標圖示的同一條，站內閃電造型一致。 */
            el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
            el.style.setProperty('--pd', (i * .32) + 's');   // 脈衝錯拍
            el.addEventListener('click', () => {
                document.querySelectorAll('.spot').forEach(o => o.classList.remove('is-active'));
                el.classList.add('is-active');
                activeSpot = s;
                document.getElementById('cardTitle').textContent = s.title;
                document.getElementById('cardKicker').textContent = s.kicker;
                document.getElementById('cardBody').textContent = s.body;
                card.classList.add('on');
            });
            spotsHost.appendChild(el);
            s.el = el;
        });
        document.getElementById('cardClose').addEventListener('click', () => {
            card.classList.remove('on');
            document.querySelectorAll('.spot').forEach(o => o.classList.remove('is-active'));
            activeSpot = null;
        });

        const tmpV = new THREE.Vector3();
        function project(p) {
            tmpV.copy(p).project(camera);
            return {
                x: (tmpV.x * .5 + .5) * innerWidth,
                y: (-tmpV.y * .5 + .5) * innerHeight,
                front: tmpV.z < 1,
            };
        }
        function updateOverlays() {
            SPOTS.forEach(s => {
                const q = project(s.p);
                s.el.style.transform = `translate(${q.x}px, ${q.y}px)`;
                s.el.style.display = q.front ? 'grid' : 'none';
            });
            const z = ZONES[zoneIdx];
            if (z.name && z.anchor) {
                const q = project(z.anchor);
                tagEl.style.left = q.x + 'px';
                tagEl.style.top = (q.y - 8) + 'px';
            }
        }

        /* ══ 主迴圈 ═════════════════════════════════════════ */
        let lastW = 0, lastH = 0;
        function fitIfNeeded() {
            const w = innerWidth, h = innerHeight;
            if (w && h && (lastW !== w || lastH !== h)) {
                lastW = w; lastH = h;
                setFrustum();
                renderer.setSize(w, h);
                composer.setSize(w, h);
            }
        }
        addEventListener('resize', fitIfNeeded);

        const clock = new THREE.Clock();
        // 卷軸刷特寫狀態（applyScrub 定義在後）；prevT/prevZ/still 用於「鏡頭停穩」判定
        const SCRUB = { p: null, zone: -1, prevT: new THREE.Vector3(), prevZ: 1, still: 0 };
        const ANIM = { wind: 1 };   // 風機轉速倍率（調整面板）
        let windT = 0;
        function tick() {
            rafId = requestAnimationFrame(tick);
            fitIfNeeded();
            const dt = Math.min(clock.getDelta(), .05);
            updateFocusPlanes(dt);
            windT += dt * ANIM.wind;
            ROTORS.forEach(r => { r.m.rotation.z = r.ph + windT * r.sp; });   // 風機慢轉
            if (camTween) {
                camTween.t += dt / 1.05;
                const e = smootherstep(Math.min(camTween.t, 1));
                camera.position.lerpVectors(camTween.fromP, camTween.toP, e);
                controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
                camera.zoom = camTween.fromZ + (camTween.toZ - camTween.fromZ) * e;
                camera.updateProjectionMatrix();
                camera.lookAt(controls.target);
                if (camTween.t >= 1) { camTween = null; controls.enabled = true; }
            } else {
                if (SCRUB.p != null) applyScrub(dt);        // 卷軸刷特寫（固定角度）
                controls.update();
                if (window.__camSync) window.__camSync();   // 面板角度滑桿同步顯示
            }
            updateOverlays();
            composer.render();
        }

        /* 渲染迴圈可暫停：內嵌時母頁會依 iframe 可見性送 ob:active。
           同源 iframe 的 rAF 不會被瀏覽器節流 —— 不自己停的話，
           GTAO 後製會在完全看不到的位置繼續滿速燒 GPU。
           hostWants 記母頁要的狀態，分頁隱藏優先蓋過它。 */
        let rafId = 0, running = false, hostWants = true;
        function setRunning(on) {
            if (on === running) return;
            running = on;
            window.__obRunning = on;                       // 驗收探針用
            if (on) {
                clock.getDelta();
                composer.render();                         // 復工先暖機一幀：後製管線與 RT 重建的成本在離屏時付掉
                rafId = requestAnimationFrame(tick);
            }
            else cancelAnimationFrame(rafId);
        }
        addEventListener('message', e => {
            const d = e.data;
            if (!d || d.type !== 'ob:active') return;
            hostWants = !!d.on;
            setRunning(hostWants && !document.hidden);
        });
        document.addEventListener('visibilitychange', () =>
            setRunning(hostWants && !document.hidden));
        setRunning(true);

        SCENE_READY = true; SCENE_REF = scene;   // 之後面板重烘圖集才會走訪替換

        // 除錯／驗收把手（與 3d-eco-city 的 __ecoCity 同一套用法）
        window.__ob = {
            THREE, scene, camera, renderer, composer, controls,
            SKETCH, FOCUS, applySketchAmount, focusTo, wireR,
            MATS, SKETCH_LINE, SKETCH_FILL, setRunning, ZONES, focusBox, focusTo, FR_ALL,
            TEX, ATLAS_MAP, ATLAS_SIZE, bakeAtlas, useAtlas, useSeparateTextures, downloadAtlas,
            get atlasOn() { return ATLAS_ON; },
        };

        setZone(0);

        /* 開場暖機：首次縮小焦點框時，被裁切的 sketch 材質才會編譯著色器，
           那一下會卡住整幀。趁載入遮罩還在，先用小框渲染一次把成本付掉。 */
        (() => {
            const keep = { cx: FOCUS.cx, cz: FOCUS.cz, r: FOCUS.r, tx: FOCUS.tx, tz: FOCUS.tz, tr: FOCUS.tr };
            focusTo(0, 0, 20);
            updateFocusPlanes(1);
            composer.render();
            Object.assign(FOCUS, keep);
            updateFocusPlanes(1);
            composer.render();
        })();

        requestAnimationFrame(() => requestAnimationFrame(() =>
            document.getElementById('loading').classList.add('is-done')));

        /* ══ 卷軸刷特寫（scrub）═══════════════════════════════
           外層傳入 0-1 進度，沿指定路徑連續插值目標點與縮放；
           視角方向來自 camDirNow()（可緩慢自轉）。
           巡覽順序（使用者指定）：全景 → 儲能陣列(2) → 太陽能(1) → 變電站(3)
           → 風力發電(5) → 輸電鐵塔(6) → 控制中心(4) → 全景。
           第一段（全景→儲能）不吃捲軸：父頁把「開窗進度」映射到 p∈[0,1/7]
           每幀傳進來（見父頁的 __obIntro／SEG0）—— 洞張多大鏡頭就飛多近，
           洞全開的那一幀正好落在場站中心的電池貨櫃特寫，開窗與運鏡疊成同一個動作。
           數字是 ZONES 的索引；父頁卡片（index00 / index00-earth 的 .zc-item）
           已照這個順序重排，改這裡要連卡片一起改。 */
        const SCRUB_PATH = [0, 2, 1, 3, 5, 6, 4, 0];       // 巡覽路徑：首段配合開窗飛進儲能，尾段縮回全景
        function applyScrub(dt) {
            const segs = SCRUB_PATH.length - 1;
            const f = Math.min(Math.max(SCRUB.p, 0), 1) * segs;
            const i = Math.min(segs - 1, Math.floor(f));
            const e = smootherstep(f - i);                 // 每段緩入緩出：到站有停留感
            const za = ZONES[SCRUB_PATH[i]], zb = ZONES[SCRUB_PATH[i + 1]];
            const tgt = za.t.clone().lerp(zb.t, e);
            const zm = za.zoom + (zb.zoom - za.zoom) * e;
            /* 段內的視角關鍵幀：跟 t／zoom 走同一條 e 曲線，
               到站前的緩出讓鏡頭「轉到定位」與「移到定位」同時完成 */
            const azA = zoneAz(za), poA = zonePo(za);
            const tAz = azA + arcDelta(azA, zoneAz(zb)) * e;
            const tPo = poA + (zonePo(zb) - poA) * e;
            /* 追隨捲動：外層若有 Lenis，捲動進度本身已平滑，
               這裡就別再重壓緩動（兩邊都加會變黏），只留一點吸收抖動 */
            const k = 1 - Math.exp(-dt * 13);
            controls.target.lerp(tgt, k);
            camera.zoom += (zm - camera.zoom) * k;
            /* 轉向與平移共用同一顆 k：快速捲動時一起落後、停下時一起收斂。
               分開給係數會看到「先轉到位、才慢慢平移過去」的脫節 */
            SCRUB_DIR.az += arcDelta(SCRUB_DIR.az, tAz) * k;
            SCRUB_DIR.po += (tPo - SCRUB_DIR.po) * k;
            if (SPIN_DPS) SPIN.a += dt * SPIN_DPS * Math.PI / 180;
            /* SPIN 原本是把 CAM_DIR 繞 Y 軸轉，繞 Y 軸就是加在方位角上，
               所以直接疊進 theta，行為與 camDirNow() 等價 */
            SCRUB_DIR.s.set(1, SCRUB_DIR.po, SCRUB_DIR.az + SPIN.a);
            camera.position.copy(controls.target)
                .addScaledVector(SCRUB_DIR.v.setFromSpherical(SCRUB_DIR.s), R);
            camera.updateProjectionMatrix();
            camera.lookAt(controls.target);
            /* 顯示判定：鏡頭是否已追上捲動位置對應的構圖（與幀率無關）。
               快速捲動時鏡頭落後 → 隱藏錨點（不飄）；停止捲動鏡頭收斂 → 淡入 */
            const caughtUp = controls.target.distanceTo(tgt) < 1.2
                && Math.abs(camera.zoom - zm) < .06
                /* 角度也要收斂才算到站（.05 rad ≈ 2.9°）——
                   否則鏡頭還在轉，熱點就已經淡進來跟著飄 */
                && Math.abs(arcDelta(SCRUB_DIR.az, tAz)) < .05
                && Math.abs(SCRUB_DIR.po - tPo) < .05;
            document.body.classList.toggle('at-stop', caughtUp);
            // 最接近的區域 → 錨點轉橘（全景無錨點）
            const near = SCRUB_PATH[Math.round(SCRUB.p * segs)];
            /* 焦點方框：鎖在「最近站」的設備上（與卡片／錨點同一個判定），
               靠 updateFocusPlanes 的平滑滑過去。
               若改成跟鏡頭插值位置走，卡片切到下一站時框還在半路，會對不上 */
            const fz = ZONES[near] || ZONES[0];
            // 有 box 就用緊貼設備的矩形，沒有才退回半徑正方形
            if (fz.box) focusBox(...fz.box);
            else focusTo(fz.t.x, fz.t.z, fz.fr || FR_ALL);
            if (near !== SCRUB.zone) {
                SCRUB.zone = near;
                document.querySelectorAll('.spot.is-zone').forEach(o => o.classList.remove('is-zone'));
                const si = ZONE_SPOT[near];
                if (si != null && SPOTS[si] && SPOTS[si].el) SPOTS[si].el.classList.add('is-zone');
            }
        }

        /* 外層頁面控制（iframe postMessage）：
           {type:'ob:zone', index:0-4} 跳段飛行
           {type:'ob:scrub', p:0-1}    卷軸連續刷特寫 */
        addEventListener('message', e => {
            const d = e.data;
            if (!d) return;
            if (d.type === 'ob:zone' && !isNaN(+d.index)) setZone(+d.index);
            else if (d.type === 'ob:scrub' && typeof d.p === 'number') {
                if (SCRUB.p == null) syncScrubDir();   // 首次進入才對齊，之後由插值接管
                SCRUB.p = d.p;
                camTween = null;            // 取消跳段飛行，交給 scrub
                controls.enabled = !LOCKED;
                document.body.classList.add('scrub-mode');
            }
        });

        /* ══ 調整面板（lil-gui）══════════════════════════════
           一般開啟即顯示；?embed=1 嵌入模式隱藏，加 &gui=1 可強制打開 */
        if (!EMBED || Q.has('gui')) {
            const gui = new GUI({ title: '場景參數' });
            gui.add(DISPLAY, 'base').name('底座')
                .onChange(setBaseVisible);

            /* 線稿：0＝全實體、1＝整場線條。中間值是「焦點框」——
               框內保持實體、框外變線稿，可以做出只有主角上色的效果 */
            /* UV 圖集：8 張分頁貼圖併成單張 2048²，材質改吃圖集的區塊。
               「匯出」存成 textures/tex-atlas.png 覆蓋後重新整理，就會改讀那張。 */
            const gT = gui.addFolder('UV 圖集 / Atlas');
            gT.add({ f: () => downloadAtlas() }, 'f').name('⤓ 匯出 tex-atlas.png');
            gT.add({ f: () => useAtlas(new THREE.CanvasTexture(bakeAtlas())) }, 'f').name('↻ 重烘圖集');
            gT.add({ f: () => useSeparateTextures() }, 'f').name('◧ 切回獨立貼圖（對照用）');
            gT.close();

            const gS = gui.addFolder('線稿 / Wireframe');
            const refreshGui = () => gui.controllersRecursive().forEach(c => c.updateDisplay());
            gS.add(SKETCH, 'amount', 0, 1, .01).name('線稿強度').onChange(applySketchAmount).listen();
            gS.add({ f: () => { SKETCH.amount = 1; applySketchAmount(); refreshGui(); } }, 'f').name('◱ 全部變線條');
            gS.add({ f: () => { SKETCH.amount = 0; applySketchAmount(); refreshGui(); } }, 'f').name('◼ 全部回實體');
            const SK = { 線色: '#' + SKETCH_LINE.color.getHexString(), 線條濃度: SKETCH_LINE.opacity, 底色: '#' + SKETCH_FILL.color.getHexString() };
            gS.addColor(SK, '線色').onChange(v => SKETCH_LINE.color.set(v));
            gS.add(SK, '線條濃度', 0, 1, .01).onChange(v => { SKETCH_LINE.opacity = v; });
            gS.addColor(SK, '底色').onChange(v => SKETCH_FILL.color.set(v));

            const hex = c => '#' + c.getHexString();

            const gC = gui.addFolder('配色');
            const COLOR_ITEMS = [
                ['base', '主體白'], ['soft', '混凝土'], ['mid', '金屬件'], ['deep', '百葉深灰'],
                ['edge', '點綴橘'], ['pipeB', '飾條青'], ['pipeY', '管線黃'], ['pipeW', '管線白'],
                ['pv', '太陽能板'], ['gravel', '碎石'], ['fence', '圍籬網'], ['roof', '貨櫃屋頂'],
            ];
            const PC = {};
            COLOR_ITEMS.forEach(([k, label]) => {
                if (!MATS[k]) return;
                PC[k] = hex(MATS[k].color);
                gC.addColor(PC, k).name(label).onChange(v => MATS[k].color.set(v));
            });
            PC.ground = hex(ground.material.color);
            gC.addColor(PC, 'ground').name('地面').onChange(v => ground.material.color.set(v));
            PC.bg = hex(scene.background);
            gC.addColor(PC, 'bg').name('背景').onChange(v => { scene.background.set(v); scene.fog.color.set(v); });

            const gV = gui.addFolder('角度（等距視角）');
            const CAMP = {
                方位角: THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()),
                俯仰角: THREE.MathUtils.radToDeg(controls.getPolarAngle()),
            };
            const applyAngles = () => {
                controls.autoRotate = false;
                controls.minPolarAngle = .12;     // 放寬預設夾角，滑桿全程有效
                controls.maxPolarAngle = 1.5;
                const r = camera.position.distanceTo(controls.target) || R;
                const sph = new THREE.Spherical(r,
                    THREE.MathUtils.degToRad(CAMP.俯仰角),
                    THREE.MathUtils.degToRad(CAMP.方位角));
                camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
                camera.lookAt(controls.target);
            };
            gV.add(CAMP, '方位角', -180, 180, .5).onChange(applyAngles).listen();
            gV.add(CAMP, '俯仰角', 8, 86, .5).onChange(applyAngles).listen();
            const VP = { 視野: viewH };
            gV.add(VP, '視野', 25, 90, 1).name('視野範圍').onChange(v => { viewH = v; setFrustum(); });
            // 拖曳/自動環繞時同步滑桿顯示
            window.__camSync = () => {
                CAMP.方位角 = THREE.MathUtils.radToDeg(controls.getAzimuthalAngle());
                CAMP.俯仰角 = THREE.MathUtils.radToDeg(controls.getPolarAngle());
            };

            const gL = gui.addFolder('光影');
            gL.add(sun, 'intensity', 0, 3, .01).name('太陽強度');
            gL.add(hemi, 'intensity', 0, 2, .01).name('天光強度');
            gL.add(fill, 'intensity', 0, 1, .01).name('補光強度');
            gL.add(scene, 'environmentIntensity', 0, 1, .01).name('環境反射');
            /* 陰影貼圖是靜態的，動到光就得手動重畫一次 */
            gL.add(sun, 'castShadow').name('陰影').onChange(redrawShadow);
            gL.add(sun.position, 'x', -150, 150, 1).name('太陽 X').onChange(redrawShadow);
            gL.add(sun.position, 'y', 40, 240, 1).name('太陽高度').onChange(redrawShadow);
            gL.add(sun.position, 'z', -150, 150, 1).name('太陽 Z').onChange(redrawShadow);
            gL.add(sun.shadow, 'normalBias', 0, 2, .01).name('陰影修正').onChange(redrawShadow);

            const gA = gui.addFolder('AO 接觸陰影');
            gA.add(gtao, 'enabled').name('啟用');
            gA.add(gtao, 'blendIntensity', 0, 1, .01).name('混合強度');
            const AOP = { radius: 1.1, thickness: 1, scale: 1.3 };
            const aoUpd = () => gtao.updateGtaoMaterial({ ...AOP, distanceExponent: 1.4, samples: 16 });
            gA.add(AOP, 'radius', .1, 4, .05).name('半徑').onChange(aoUpd);
            gA.add(AOP, 'thickness', .2, 4, .05).name('厚度').onChange(aoUpd);
            gA.add(AOP, 'scale', .2, 3, .05).name('對比').onChange(aoUpd);
            gA.close();

            const gF = gui.addFolder('霧（遠景淡出）');
            gF.add(scene.fog, 'near', 100, 700, 5).name('起點');
            gF.add(scene.fog, 'far', 200, 1200, 5).name('終點');
            gF.close();

            const gM = gui.addFolder('相機與動態');
            gM.add(camera, 'zoom', .5, 4.5, .01).name('縮放')
                .onChange(() => camera.updateProjectionMatrix()).listen();
            gM.add(controls, 'autoRotate').name('自動環繞').listen();
            gM.add(controls, 'autoRotateSpeed', -2, 2, .02).name('環繞速度');
            gM.add(ANIM, 'wind', 0, 4, .05).name('風機轉速');
            gM.close();

            const XP = {
                複製設定: () => navigator.clipboard.writeText(JSON.stringify(gui.save(), null, 2)),
            };
            gui.add(XP, '複製設定');
            window.__gui = gui;
        }

        window.__ourBusiness = { scene, camera, renderer, controls, ZONES, setZone, composer, TEX, THREE, MATS, sun, hemi, fill, gtao, ground, ANIM, FOCUS };   // 開發除錯用
    </script>
</body>

</html>
